<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glow Effects -->
  <circle cx="200" cy="150" r="280" fill="url(#glowGrad)" filter="url(#blurFilter)" />
  <circle cx="1000" cy="450" r="320" fill="url(#glowGrad)" filter="url(#blurFilter)" />

  <!-- Subtle Grid Backdrop -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(100, 70)">
    <rect width="360" height="38" rx="19" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="24" cy="19" r="6" fill="#10b981" />
    <text x="40" y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">
      BANKING PLATFORM ARCHITECTURE
    </text>
  </g>

  <!-- Brand Logo & Title -->
  <g transform="translate(100, 150)">
    <!-- HK Badge -->
    <rect width="76" height="76" rx="20" fill="url(#primaryGrad)" />
    <text x="38" y="49" fill="#ffffff" font-family="'Courier New', Courier, monospace" font-size="32" font-weight="bold" text-anchor="middle">
      HK
    </text>

    <!-- Name & Role -->
    <text x="100" y="42" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Himanshu Kumar
    </text>
    <rect x="500" y="14" width="70" height="30" rx="6" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-opacity="0.4" />
    <text x="535" y="34" fill="#38bdf8" font-family="'Courier New', Courier, monospace" font-size="14" font-weight="bold" text-anchor="middle">
      SME
    </text>
    <text x="100" y="74" fill="#06b6d4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600">
      Software Engineer &amp; Team SME @ Cognizant
    </text>
  </g>

  <!-- Headline Subtext -->
  <text x="100" y="290" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Digital Banking Platforms | Reactive Spring Boot | Apache Kafka Event Streaming
  </text>

  <!-- Metrics Highlight Cards -->
  <g transform="translate(100, 340)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="225" height="110" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" />
      <text x="24" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">5/5</text>
      <text x="24" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">3 Yrs Top Rating</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(255, 0)">
      <rect width="225" height="110" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" />
      <text x="24" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">20+</text>
      <text x="24" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Teams Impacted</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(510, 0)">
      <rect width="225" height="110" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" />
      <text x="24" y="48" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">2</text>
      <text x="24" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Granted Patents</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(765, 0)">
      <rect width="235" height="110" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#1e293b" stroke-width="1.5" />
      <text x="24" y="48" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800">100%</text>
      <text x="24" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">Code Test Coverage</text>
    </g>
  </g>

  <!-- Footer Banner -->
  <g transform="translate(100, 520)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="40" fill="#64748b" font-family="'Courier New', Courier, monospace" font-size="16">
      https://maurihimanshu.github.io | https://himanshumauri.github.io
    </text>
    <text x="1000" y="40" fill="#38bdf8" font-family="'Courier New', Courier, monospace" font-size="16" font-weight="bold" text-anchor="end">
      &gt;_ Interactive Web CLI &amp; Docs
    </text>
  </g>
</svg>
