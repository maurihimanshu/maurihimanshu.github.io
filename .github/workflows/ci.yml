name: Enterprise CI & GitHub Pages Deployment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build, Type Check & Test Coverage (100%)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript & Production Bundle Build
        run: npm run build

      - name: Verify GitHub Pages files
        run: |
          echo "Checking asset links file..."
          test -f dist/.well-known/assetlinks.json
          test -f dist/.nojekyll
          echo "Files present in build output:"
          find dist -maxdepth 3 -type f -print

      - name: Run Tests with 100% Coverage Enforcement
        run: npm run test:coverage

      - name: Upload Test Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          retention-days: 7
      
      - name: Create and verify Pages archive
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail

          test -f dist/.well-known/assetlinks.json

          tar --dereference --hard-dereference \
            -czf "$RUNNER_TEMP/github-pages.tar.gz" \
            -C dist .

          echo "Checking association file in archive:"
          tar -tzf "$RUNNER_TEMP/github-pages.tar.gz" \
            | grep -E '^\./\.well-known/assetlinks\.json$'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/github-pages.tar.gz
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to GitHub Pages
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
